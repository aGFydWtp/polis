# ALB 経由では X-Forwarded-Proto がそのまま渡るが、直アクセスや ALB の
# ヘルスチェックはヘッダを付けないため、空のときは $scheme にフォールバックする。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen      [::]:80 ipv6only=off;
    listen      [::]:443 ipv6only=off ssl http2;
    server_name _;
    client_max_body_size 50M;

    ssl_certificate /etc/nginx/certs/snakeoil.cert.pem;
    ssl_certificate_key /etc/nginx/certs/snakeoil.key.pem;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.1 TLSv1;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA26';
    ssl_prefer_server_ciphers on;

    # proxy_pass にホスト名を静的に書くと nginx は起動時に一度だけ名前解決した
    # IP を保持し続け、コンテナ再作成 (up -d --build) で IP が変わると 502 になる。
    # Docker 内蔵 DNS (127.0.0.11) を resolver に指定し、変数経由の proxy_pass に
    # することで TTL 付きで都度再解決させる。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $oidc_upstream oidc-simulator:${AUTH_SIMULATOR_PORT};
    set $alpha_upstream client-participation-alpha:4321;
    set $api_upstream server:${API_SERVER_PORT};

    # OIDC simulator endpoints
    location /.well-known/ {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /authorize {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /oauth/ {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /userinfo {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /login {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /usernamepassword/ {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /v2/ {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /heartbeat {
        proxy_pass https://$oidc_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }

    location /_astro/ {
        proxy_pass http://$alpha_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /alpha/ {
        # This rule removes the /alpha prefix before sending to the container.
        # e.g., /alpha/embed.js becomes /embed.js
        # e.g., /alpha/9hhmb5fufv becomes /9hhmb5fufv
        rewrite ^/alpha/(.*)$ /$1 break;

        proxy_pass http://$alpha_upstream;
        # The app can't see the stripped prefix, so tell it where it is mounted;
        # its links prepend this to stay inside /alpha/.
        proxy_set_header X-Forwarded-Prefix /alpha;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # (Fallback): All other requests go to the main backend server.
    location / {
        proxy_pass http://$api_upstream;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $host;
        # Add timeout configurations
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
