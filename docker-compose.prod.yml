# 最小コスト本番構成 (単一EC2に全サービス同居)
#
# docker-compose.yml から Delphi/Ollama/import-worker/dynamodb/minio/localstack/ses-local を除外し、
# コア6サービス + postgres のみを起動する。
#
# 起動: docker compose -f docker-compose.prod.yml up -d --build
#
# 前提:
#  - .env に本番ドメイン・OIDC設定・DBパスワード・DATABASE_URL を含めること
#    DATABASE_URL=postgres://postgres:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_DB>
#  - postgres のデータは EC2 にアタッチした EBS (/mnt/polis-data/postgres) に永続化する
#  - クライアント/ file-server はビルド時引数にドメイン等が焼き込まれるため .env を入れて --build する

name: polis

services:
  client-participation-alpha:
    build:
      context: ./client-participation-alpha
      dockerfile: Dockerfile
      args:
        - PUBLIC_SERVICE_URL=${PUBLIC_SERVICE_URL}
        - INTERNAL_SERVICE_URL=${INTERNAL_SERVICE_URL}
        - PUBLIC_AUTH_NAMESPACE=${AUTH_NAMESPACE}
        - OIDC_CACHE_KEY_PREFIX=${OIDC_CACHE_KEY_PREFIX}
        - OIDC_CACHE_KEY_ID_TOKEN_SUFFIX=${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
    container_name: client-participation-alpha
    restart: unless-stopped
    networks:
      - "polis-net"
    environment:
      - PUBLIC_SERVICE_URL=${PUBLIC_SERVICE_URL}
      - PUBLIC_AUTH_NAMESPACE=${AUTH_NAMESPACE}
      - INTERNAL_SERVICE_URL=${INTERNAL_SERVICE_URL}
      - PUBLIC_OIDC_CACHE_KEY_PREFIX=${OIDC_CACHE_KEY_PREFIX}
      - PUBLIC_OIDC_CACHE_KEY_ID_TOKEN_SUFFIX=${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
    depends_on:
      - "server"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
      args:
        NODE_ENV: production
    container_name: server
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL}
      - AWS_LOG_GROUP_NAME=${AWS_LOG_GROUP_NAME}
      - NODE_EXTRA_CA_CERTS=/root/.simulacrum/certs/CA/rootCA.pem
    networks:
      - "polis-net"
    volumes:
      - server-logs:/app/logs
      - /root/.simulacrum/certs:/root/.simulacrum/certs:ro
    restart: unless-stopped
    depends_on:
      - "postgres"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  math:
    build:
      context: ./math
    container_name: math
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOGGING_LEVEL=${MATH_LOG_LEVEL:-warn}
      - MATH_ENV=${MATH_ENV:-prod}
      - WEBSERVER_USERNAME=${WEBSERVER_USERNAME}
      - WEBSERVER_PASS=${WEBSERVER_PASS}
      - DATABASE_POOL_SIZE=${MATH_DATABASE_POOL_SIZE:-10}
    networks:
      - "polis-net"
    restart: unless-stopped
    depends_on:
      - "postgres"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    container_name: postgres
    restart: always
    build:
      context: ./server
      # migrations-based initialization (本番でもスキーマはマイグレーションで作成)
      dockerfile: Dockerfile-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    networks:
      - "polis-net"
    volumes:
      # アタッチした EBS 上のディレクトリに永続化（EC2 停止/置換でもデータ保持）
      - /mnt/polis-data/postgres:/var/lib/postgresql/data

  nginx-proxy:
    container_name: nginx-proxy
    build:
      context: ./file-server
      dockerfile: nginx.Dockerfile
    environment:
      - API_SERVER_PORT=${API_SERVER_PORT:-5000}
    depends_on:
      - "client-participation-alpha"
      - "server"
    networks:
      - "polis-net"
    ports:
      # ALB は EC2 の :80 に接続する（TLS は ALB で終端）
      - "80:80"

  file-server:
    container_name: file-server
    build:
      context: ./
      dockerfile: file-server/Dockerfile
      args:
        ADMIN_UIDS: ${ADMIN_UIDS}
        AUTH_AUDIENCE: ${AUTH_AUDIENCE}
        AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
        AUTH_ISSUER: ${AUTH_ISSUER}
        AUTH_NAMESPACE: ${AUTH_NAMESPACE}
        DD_APPLICATION_ID: ${DD_APPLICATION_ID}
        DD_CLIENT_TOKEN: ${DD_CLIENT_TOKEN}
        DD_SITE: ${DD_SITE}
        EMBED_SERVICE_HOSTNAME: ${EMBED_SERVICE_HOSTNAME}
        GA_TRACKING_ID: ${GA_TRACKING_ID}
        GIT_HASH: "${GIT_HASH:-placeholder}"
        NODE_ENV: production
        OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: ${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
        OIDC_CACHE_KEY_PREFIX: ${OIDC_CACHE_KEY_PREFIX}
    environment:
      - PORT=${STATIC_FILES_PORT:-8080}
    networks:
      - "polis-net"

  oidc-simulator:
    container_name: oidc-simulator
    build:
      context: ./oidc-simulator
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - /root/.simulacrum/certs:/root/.simulacrum/certs:ro
    environment:
      - AUTH_AUDIENCE=${AUTH_AUDIENCE}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_ISSUER=${AUTH_ISSUER}
      - AUTH_NAMESPACE=${AUTH_NAMESPACE:-https://pol.is/}
      - AUTH_SIMULATOR_PORT=${AUTH_SIMULATOR_PORT:-3000}
    networks:
      - "polis-net"
    restart: unless-stopped

networks:
  polis-net:

volumes:
  server-logs:
