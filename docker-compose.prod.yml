# 最小コスト本番構成 (単一EC2に全サービス同居)
#
# docker-compose.yml から Delphi/Ollama/dynamodb/minio/ses-local を除外し、
# コア6サービス + postgres + BYOD 票インポート用の localstack/import-worker を起動する。
#
# BYOD 票インポート (POST /api/v3/votes-bulk):
#  - S3/SQS は実 AWS ではなく EC2 内の localstack (SERVICES=sqs,s3) で自己完結させる
#    (EC2 ロールに S3/SQS 権限が不要でコスト最小。CSV は取り込み後に削除される一時データ)
#  - dev と異なり minio は置かず、S3 も localstack が兼ねる
#    (バケット/キューは bin/localstack-init-prod/init-aws.sh が作成)
#
# 起動: docker compose -f docker-compose.prod.yml up -d --build
#
# 前提:
#  - .env に本番ドメイン・OIDC設定・DBパスワード・DATABASE_URL を含めること
#    DATABASE_URL=postgres://postgres:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_DB>
#  - postgres のデータは EC2 にアタッチした EBS (/mnt/polis-data/postgres) に永続化する
#  - クライアント/ file-server はビルド時引数にドメイン等が焼き込まれるため .env を入れて --build する

name: polis

services:
  client-participation-alpha:
    build:
      context: ./client-participation-alpha
      dockerfile: Dockerfile
      args:
        - PUBLIC_SERVICE_URL=${PUBLIC_SERVICE_URL}
        - INTERNAL_SERVICE_URL=${INTERNAL_SERVICE_URL}
        - PUBLIC_AUTH_NAMESPACE=${AUTH_NAMESPACE}
        - OIDC_CACHE_KEY_PREFIX=${OIDC_CACHE_KEY_PREFIX}
        - OIDC_CACHE_KEY_ID_TOKEN_SUFFIX=${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
    container_name: client-participation-alpha
    restart: unless-stopped
    networks:
      - "polis-net"
    environment:
      - PUBLIC_SERVICE_URL=${PUBLIC_SERVICE_URL}
      - PUBLIC_AUTH_NAMESPACE=${AUTH_NAMESPACE}
      - INTERNAL_SERVICE_URL=${INTERNAL_SERVICE_URL}
      - PUBLIC_OIDC_CACHE_KEY_PREFIX=${OIDC_CACHE_KEY_PREFIX}
      - PUBLIC_OIDC_CACHE_KEY_ID_TOKEN_SUFFIX=${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
    depends_on:
      - "server"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
      args:
        NODE_ENV: production
    container_name: server
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL}
      - AWS_LOG_GROUP_NAME=${AWS_LOG_GROUP_NAME}
      - NODE_EXTRA_CA_CERTS=/root/.simulacrum/certs/CA/rootCA.pem
      # BYOD 票インポート: S3/SQS は localstack で自己完結 (認証情報はダミーで可)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-localstack}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-localstack}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-http://localstack:4566}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-polis-delphi}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-http://localstack:4566/000000000000/import-jobs-queue}
    networks:
      - "polis-net"
    volumes:
      - server-logs:/app/logs
      - /root/.simulacrum/certs:/root/.simulacrum/certs:ro
    restart: unless-stopped
    depends_on:
      - "postgres"
      - "localstack"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  math:
    build:
      context: ./math
    container_name: math
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOGGING_LEVEL=${MATH_LOG_LEVEL:-warn}
      - MATH_ENV=${MATH_ENV:-prod}
      - WEBSERVER_USERNAME=${WEBSERVER_USERNAME}
      - WEBSERVER_PASS=${WEBSERVER_PASS}
      - DATABASE_POOL_SIZE=${MATH_DATABASE_POOL_SIZE:-10}
    networks:
      - "polis-net"
    restart: unless-stopped
    depends_on:
      - "postgres"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    container_name: postgres
    restart: always
    build:
      context: ./server
      # migrations-based initialization (本番でもスキーマはマイグレーションで作成)
      dockerfile: Dockerfile-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    networks:
      - "polis-net"
    volumes:
      # アタッチした EBS 上のディレクトリに永続化（EC2 停止/置換でもデータ保持）
      - /mnt/polis-data/postgres:/var/lib/postgresql/data

  nginx-proxy:
    container_name: nginx-proxy
    restart: unless-stopped
    build:
      context: ./file-server
      dockerfile: nginx.Dockerfile
    environment:
      - API_SERVER_PORT=${API_SERVER_PORT:-5000}
    depends_on:
      - "client-participation-alpha"
      - "server"
    networks:
      - "polis-net"
    ports:
      # ALB は EC2 の :80 に接続する（TLS は ALB で終端）
      - "80:80"

  file-server:
    container_name: file-server
    restart: unless-stopped
    build:
      context: ./
      dockerfile: file-server/Dockerfile
      args:
        ADMIN_UIDS: ${ADMIN_UIDS}
        AUTH_AUDIENCE: ${AUTH_AUDIENCE}
        AUTH_CLIENT_ID: ${AUTH_CLIENT_ID}
        AUTH_ISSUER: ${AUTH_ISSUER}
        AUTH_NAMESPACE: ${AUTH_NAMESPACE}
        DD_APPLICATION_ID: ${DD_APPLICATION_ID}
        DD_CLIENT_TOKEN: ${DD_CLIENT_TOKEN}
        DD_SITE: ${DD_SITE}
        EMBED_SERVICE_HOSTNAME: ${EMBED_SERVICE_HOSTNAME}
        GA_TRACKING_ID: ${GA_TRACKING_ID}
        GIT_HASH: "${GIT_HASH:-placeholder}"
        NODE_ENV: production
        OIDC_CACHE_KEY_ID_TOKEN_SUFFIX: ${OIDC_CACHE_KEY_ID_TOKEN_SUFFIX}
        OIDC_CACHE_KEY_PREFIX: ${OIDC_CACHE_KEY_PREFIX}
    environment:
      - PORT=${STATIC_FILES_PORT:-8080}
    networks:
      - "polis-net"

  oidc-simulator:
    container_name: oidc-simulator
    build:
      context: ./oidc-simulator
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - /root/.simulacrum/certs:/root/.simulacrum/certs:ro
    environment:
      - AUTH_AUDIENCE=${AUTH_AUDIENCE}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_ISSUER=${AUTH_ISSUER}
      - AUTH_NAMESPACE=${AUTH_NAMESPACE:-https://pol.is/}
      - AUTH_SIMULATOR_PORT=${AUTH_SIMULATOR_PORT:-3000}
    networks:
      - "polis-net"
    restart: unless-stopped

  # BYOD 票インポートの SQS/S3 エミュレータ (EC2 内で自己完結)
  localstack:
    # 2026.x 以降はライセンストークン必須になったため、無料で使える最終版に固定
    image: localstack/localstack:4.14.0
    container_name: localstack
    restart: unless-stopped
    environment:
      - SERVICES=sqs,s3
      # SQS のキューはリージョン単位で分離されるため、server/import-worker が署名に使う
      # AWS_REGION (.env 由来) と同じリージョンで init スクリプトにリソースを作らせる
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - "./bin/localstack-init-prod:/etc/localstack/init/ready.d"
    networks:
      - "polis-net"

  # BYOD 票インポートのジョブ処理ワーカー (SQS からジョブを取り出し S3 の CSV を votes に取り込む)
  import-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
      args:
        NODE_ENV: production
    container_name: import-worker
    # prod イメージは tsc ビルド済みのため dist 配下のワーカーを直接起動する
    command: node --max_old_space_size=1024 dist/src/workers/start-import-worker.js
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL=${DATABASE_SSL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-localstack}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-localstack}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-http://localstack:4566}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-polis-delphi}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-http://localstack:4566/000000000000/import-jobs-queue}
      - SERVER_LOG_LEVEL=info
    networks:
      - "polis-net"
    restart: unless-stopped
    depends_on:
      - "postgres"
      - "localstack"

networks:
  polis-net:

volumes:
  server-logs:
